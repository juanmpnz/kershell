  <text x="1120" y="108" font-family="Geist Mono, ui-monospace, monospace" font-size="14" letter-spacing="0.16em" fill="#B4F23F" text-anchor="end" text-transform="uppercase">KERSHELL-TI.VERCEL.APP</text>

  
  <g transform="translate(80, 280)">
